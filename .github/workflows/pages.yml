name: Verify and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'pages-production' || format('verify-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  worker:
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-worker.yml
    secrets: inherit

  build:
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_STATION_API_URL: ${{ vars.VITE_STATION_API_URL }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Node dependencies
        run: npm ci
      - name: Install pinned Python reference dependencies
        run: pip install -r reference-python/requirements.txt
      - name: Install pinned Python audit tool
        run: pip install -r reference-python/requirements-audit.txt
      - name: Validate production station API URL
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const value = process.env.VITE_STATION_API_URL?.trim()
          if (!value) throw new Error('VITE_STATION_API_URL is required')
          let url
          try { url = new URL(value) } catch { throw new Error('VITE_STATION_API_URL must be a valid URL') }
          if (url.protocol !== 'https:' || url.username || url.password || url.hash) {
            throw new Error('VITE_STATION_API_URL must use HTTPS with no credentials or fragment')
          }
          NODE
      - name: Verify public release inputs and production build
        run: npm run verify:public
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production-preview browser tests
        run: npm run e2e
      - name: Build Pages artifact with the validated station API URL
        run: npm run build:public
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
